<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="1060" height="470" fill="white"/><text x="24" y="38" font-size="22" font-weight="700" fill="#101c36" text-anchor="start">Weekly cycle: four Swarms patterns do the work, plain code guards YouTube</text><rect x="40" y="70" width="300" height="120" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="54" y="96" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">1 Plan (Monday)</text><text x="54" y="118" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">HierarchicalSwarm</text><text x="54" y="137" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Director gives orders to 3 helpers,</text><text x="54" y="156" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">then writes the week's plan</text><rect x="380" y="70" width="300" height="120" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="394" y="96" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">2 Script (Tuesday)</text><text x="394" y="118" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">SequentialWorkflow</text><text x="394" y="137" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Scriptwriter, then Fact-Checker,</text><text x="394" y="156" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">loop in code, max 2 rounds</text><rect x="720" y="70" width="300" height="120" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="734" y="96" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">3 Package (Wednesday)</text><text x="734" y="118" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">ConcurrentWorkflow</text><text x="734" y="137" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Visual, Packaging &amp; SEO, Shorts;</text><text x="734" y="156" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">then code renders the videos</text><rect x="720" y="280" width="300" height="120" rx="9" fill="#fff6e0" stroke="#c08a00" stroke-width="2"/><text x="734" y="306" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">4 Approve (Thursday)</text><text x="734" y="328" font-size="13" font-weight="400" fill="#101c36" text-anchor="start">Plain code, no agent</text><text x="734" y="347" font-size="13" font-weight="400" fill="#101c36" text-anchor="start">Professor watches, edits, picks a</text><text x="734" y="366" font-size="13" font-weight="400" fill="#101c36" text-anchor="start">thumbnail, approves or rejects</text><rect x="380" y="280" width="300" height="120" rx="9" fill="#fff6e0" stroke="#c08a00" stroke-width="2"/><text x="394" y="306" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">5 Publish (Friday)</text><text x="394" y="328" font-size="13" font-weight="400" fill="#101c36" text-anchor="start">Plain code, no agent</text><text x="394" y="347" font-size="13" font-weight="400" fill="#101c36" text-anchor="start">Uploads approved videos only,</text><text x="394" y="366" font-size="13" font-weight="400" fill="#101c36" text-anchor="start">always private, AI disclosure set</text><rect x="40" y="280" width="300" height="120" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="54" y="306" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">6 Review (Sunday)</text><text x="54" y="328" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">SequentialWorkflow</text><text x="54" y="347" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Analytics Analyst, then Monetization</text><text x="54" y="366" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Manager: profit report, 3 next steps</text><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M340,130 L380,130" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M680,130 L720,130" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M870,190 L870,280" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M720,340 L680,340" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M380,340 L340,340" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M190,280 L190,190" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><text x="200" y="240" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">next week's plan reads the 3 recommendations</text><text x="40" y="445" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Shaded boxes are plain code: only the professor's approval lets a video reach YouTube, and always as private.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>