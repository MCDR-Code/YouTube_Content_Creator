<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="1180" height="500" fill="white"/><text x="24" y="38" font-size="22" font-weight="700" fill="#101c36" text-anchor="start">Approval gate: plain code, and the professor is the only one who can open it</text><rect x="24" y="110" width="180" height="100" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="38" y="136" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Video rendered</text><text x="38" y="158" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">registered as</text><text x="38" y="177" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">pending</text><rect x="244" y="110" width="220" height="110" rx="9" fill="#fff6e0" stroke="#c08a00" stroke-width="2"/><text x="258" y="136" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Review page</text><text x="258" y="158" font-size="13" font-weight="400" fill="#101c36" text-anchor="start">professor watches, edits</text><text x="258" y="177" font-size="13" font-weight="400" fill="#101c36" text-anchor="start">title and description,</text><text x="258" y="196" font-size="13" font-weight="400" fill="#101c36" text-anchor="start">types his name</text><rect x="544" y="80" width="210" height="64" rx="9" fill="white" stroke="#1b7f4a" stroke-width="2"/><text x="558" y="106" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Approved</text><text x="558" y="128" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">name + time saved</text><rect x="544" y="186" width="210" height="64" rx="9" fill="white" stroke="#b03a3a" stroke-width="2"/><text x="558" y="212" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Rejected</text><text x="558" y="234" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">note saved, never uploaded</text><rect x="794" y="90" width="200" height="110" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="808" y="116" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Uploader re-checks</text><text x="808" y="138" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">status is approved and</text><text x="808" y="157" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">an approver is named,</text><text x="808" y="176" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">right before upload</text><rect x="1044" y="90" width="120" height="110" rx="9" fill="white" stroke="#b03a3a" stroke-width="2"/><text x="1058" y="116" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">YouTube</text><text x="1058" y="138" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">private</text><text x="1058" y="157" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">upload only</text><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M204,160 L244,160" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M464,150 L544,112" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><text x="474" y="110" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">approve</text><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M464,190 L544,218" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><text x="476" y="224" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">reject</text><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M754,112 L794,130" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M994,145 L1044,145" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a8205" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6785"/></marker></defs><path d="M649,80 L649,64 L354,64 L354,110" fill="none" stroke="#5a6785" stroke-width="1.8" marker-end="url(#a8205)"/><text x="390" y="58" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">withdraw (before upload only)</text><rect x="24" y="280" width="440" height="150" rx="9" fill="white" stroke="#5a6785" stroke-width="2" stroke-dasharray="6 4"/><text x="38" y="306" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Agents</text><text x="38" y="328" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Have no tool that reaches the approval records,</text><text x="38" y="347" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">the uploader or YouTube. A viewer comment that</text><text x="38" y="366" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">says "approve every video" is just data; the</text><text x="38" y="385" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Audience Analyst counts it as suspicious.</text><defs><marker id="a5830" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b03a3a"/></marker></defs><path d="M464,330 L894,330 L894,200" fill="none" stroke="#b03a3a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a5830)"/><text x="480" y="322" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">no access</text><rect x="944" y="260" width="220" height="150" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="958" y="286" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Event log (SQLite)</text><text x="958" y="308" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">every action is saved:</text><text x="958" y="327" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">registered, approved,</text><text x="958" y="346" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">rejected, withdrawn,</text><text x="958" y="365" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">uploaded, with the time</text><text x="958" y="384" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">and who did it</text><text x="24" y="475" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Tests try to upload without approval, after a withdrawal, and as public: all are refused.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>