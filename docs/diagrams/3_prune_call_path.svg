<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="1180" height="430" fill="white"/><text x="24" y="38" font-size="22" font-weight="700" fill="#101c36" text-anchor="start">One model call: from an agent, through Prune with its own key, to the cost log</text><rect x="24" y="90" width="210" height="150" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="38" y="116" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Swarms Agent</text><text x="38" y="138" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">e.g. Scriptwriter</text><text x="38" y="157" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">own key PRUNE_KEY_...</text><text x="38" y="176" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">model openai/gpt-4o-mini</text><text x="38" y="195" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">headers: run ID, budget,</text><text x="38" y="214" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">feature tag</text><rect x="274" y="90" width="170" height="150" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="288" y="116" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">LiteLLM</text><text x="288" y="138" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">inside Swarms</text><text x="288" y="157" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">chat/completions</text><text x="288" y="176" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">to llm_base_url</text><rect x="484" y="90" width="260" height="150" rx="9" fill="white" stroke="#00a896" stroke-width="2"/><text x="498" y="116" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Prune checks first</text><text x="498" y="138" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">1 key valid</text><text x="498" y="157" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">2 daily spend cap for this key</text><text x="498" y="176" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">3 run budget for this week</text><text x="498" y="195" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">4 Shield (injection, loops,</text><text x="498" y="214" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">   model allowlist)</text><rect x="784" y="90" width="170" height="150" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="798" y="116" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Provider</text><text x="798" y="138" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">OpenAI, using the key</text><text x="798" y="157" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">in Prune's vault</text><rect x="994" y="90" width="160" height="150" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="1008" y="116" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Reply</text><text x="1008" y="138" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">JSON answer +</text><text x="1008" y="157" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">prune_metadata:</text><text x="1008" y="176" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">cost, cache hit,</text><text x="1008" y="195" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">signed receipt</text><rect x="784" y="290" width="370" height="110" rx="9" fill="white" stroke="#b03a3a" stroke-width="2"/><text x="798" y="316" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Blocked: HTTP 429 (spend_cap, run_budget)</text><text x="798" y="338" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">or 403 (prompt_injection, model_blocked).</text><text x="798" y="357" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Costs nothing. Our code stops that agent</text><text x="798" y="376" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">cleanly and logs the code.</text><rect x="24" y="290" width="420" height="110" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="38" y="316" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Cost tracker (LiteLLM logger)</text><text x="38" y="338" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">logs/cost_log.jsonl: agent, part of week,</text><text x="38" y="357" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">tokens, cost, receipt, Shield code.</text><text x="38" y="376" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Never writes a key.</text><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M234,165 L274,165" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M444,165 L484,165" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M744,165 L784,165" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M954,165 L994,165" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a5830" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b03a3a"/></marker></defs><path d="M614,240 L614,345 L784,345" fill="none" stroke="#b03a3a" stroke-width="1.8" marker-end="url(#a5830)"/><text x="622" y="300" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">blocked</text><defs><marker id="a8205" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6785"/></marker></defs><path d="M1074,90 L1074,66 L129,66 L129,90" fill="none" stroke="#5a6785" stroke-width="1.8" marker-end="url(#a8205)"/><text x="520" y="60" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">reply goes back to the agent</text><defs><marker id="a8205" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6785"/></marker></defs><path d="M359,240 L359,290" fill="none" stroke="#5a6785" stroke-width="1.8" marker-end="url(#a8205)"/><text x="367" y="270" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">logs every call</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>