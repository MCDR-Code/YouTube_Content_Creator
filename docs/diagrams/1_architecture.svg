<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="1180" height="660" fill="white"/><text x="24" y="38" font-size="22" font-weight="700" fill="#101c36" text-anchor="start">System architecture: ten Swarms agents, one Prune gateway, plain code at the edges</text><rect x="24" y="64" width="560" height="400" rx="12" fill="#00a896" fill-opacity="0.07" stroke="#00a896" stroke-width="1.5"/><text x="38" y="88" font-size="14" font-weight="700" fill="#00a896" text-anchor="start">Swarms agents (each with its own Prune key and daily cap)</text><rect x="44" y="104" width="250" height="108" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="58" y="130" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Plan: HierarchicalSwarm</text><text x="58" y="152" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Channel Director gives orders to</text><text x="58" y="171" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Trend Scout, Audience Analyst,</text><text x="58" y="190" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Monetization Manager</text><rect x="314" y="104" width="250" height="108" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="328" y="130" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Script: SequentialWorkflow</text><text x="328" y="152" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Scriptwriter, then Fact-Checker</text><text x="328" y="171" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">loop in code, max 2 rounds</text><rect x="44" y="232" width="250" height="108" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="58" y="258" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Package: ConcurrentWorkflow</text><text x="58" y="280" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Visual Designer, Packaging &amp; SEO,</text><text x="58" y="299" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Shorts Producer at the same time</text><rect x="314" y="232" width="250" height="108" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="328" y="258" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Review: SequentialWorkflow</text><text x="328" y="280" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Analytics Analyst, then</text><text x="328" y="299" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Monetization Manager</text><text x="44" y="372" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Every agent: JSON output checked against a fixed shape.</text><text x="44" y="392" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">No agent has a tool that reaches approvals, files or YouTube.</text><text x="44" y="412" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Numbers come from code; agents only interpret them.</text><text x="44" y="432" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Viewer comments are data inside &lt;comments&gt;, never instructions.</text><rect x="670" y="104" width="220" height="150" rx="9" fill="white" stroke="#00a896" stroke-width="2"/><text x="684" y="130" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Prune gateway</text><text x="684" y="152" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">api.withprune.com/v1</text><text x="684" y="171" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">per-key daily spend caps</text><text x="684" y="190" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">run budget per week</text><text x="684" y="209" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Shield, signed receipts</text><rect x="940" y="104" width="210" height="110" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="954" y="130" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Model provider</text><text x="954" y="152" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">OpenAI (key kept in</text><text x="954" y="171" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">Prune's vault, never</text><text x="954" y="190" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">in our code)</text><rect x="670" y="290" width="220" height="110" rx="9" fill="white" stroke="#101c36" stroke-width="2" stroke-dasharray="6 4"/><text x="684" y="316" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Mock Prune (mock mode)</text><text x="684" y="338" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">local, free, same format</text><text x="684" y="357" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">fake costs and receipts</text><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M584,160 L670,160" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><text x="596" y="150" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">all calls</text><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M890,159 L940,159" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M584,330 L670,340" fill="none" stroke="#101c36" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a811)"/><text x="592" y="362" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">mock mode</text><rect x="24" y="490" width="1126" height="150" rx="12" fill="#101c36" fill-opacity="0.07" stroke="#101c36" stroke-width="1.5"/><text x="1136" y="514" font-size="14" font-weight="700" fill="#101c36" text-anchor="end">Plain code (no language model)</text><rect x="44" y="524" width="200" height="96" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="58" y="550" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Video maker</text><text x="58" y="572" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">slides, voice, captions,</text><text x="58" y="591" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">MP4s, 3 thumbnails</text><rect x="264" y="524" width="200" height="96" rx="9" fill="white" stroke="#c08a00" stroke-width="2"/><text x="278" y="550" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Review page</text><text x="278" y="572" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">professor approves or</text><text x="278" y="591" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">rejects (127.0.0.1)</text><rect x="484" y="524" width="200" height="96" rx="9" fill="white" stroke="#c08a00" stroke-width="2"/><text x="498" y="550" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Approval gate</text><text x="498" y="572" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">status + event log</text><text x="498" y="591" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">in SQLite</text><rect x="704" y="524" width="200" height="96" rx="9" fill="white" stroke="#c08a00" stroke-width="2"/><text x="718" y="550" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Uploader</text><text x="718" y="572" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">approved only,</text><text x="718" y="591" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">always private</text><rect x="924" y="524" width="206" height="96" rx="9" fill="white" stroke="#101c36" stroke-width="2"/><text x="938" y="550" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">Cost log + money</text><text x="938" y="572" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">cost per agent, profit;</text><text x="938" y="591" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">feeds the Sunday review</text><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M169,464 L144,524" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M244,572 L264,572" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M464,572 L484,572" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M684,572 L704,572" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><rect x="940" y="290" width="210" height="110" rx="9" fill="white" stroke="#b03a3a" stroke-width="2"/><text x="954" y="316" font-size="15" font-weight="700" fill="#101c36" text-anchor="start">YouTube</text><text x="954" y="338" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">private uploads only;</text><text x="954" y="357" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">professor makes public</text><text x="954" y="376" font-size="13" font-weight="400" fill="#5a6785" text-anchor="start">in YouTube Studio</text><defs><marker id="a811" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101c36"/></marker></defs><path d="M804,524 L804,470 L1045,470 L1045,400" fill="none" stroke="#101c36" stroke-width="1.8" marker-end="url(#a811)"/><text x="880" y="462" font-size="12" font-weight="400" fill="#5a6785" text-anchor="start">private upload</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>